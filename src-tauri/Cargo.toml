[package]
name = "ruchoir-desktop"
description = "Ruchoir for Windows, macOS and Linux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
ruchoir-desktop-core = { path = "../core" }
# The sign-in's browser and loopback redirect (Ruchoir/core, MPL-2.0), the same release as the core's.
ruchoir-native = { git = "https://github.com/Ruchoir/core", tag = "v0.6.0" }
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-log = "=2.10.1"
log = "=0.4.34"
getrandom = "=0.3.4"
# Without its `zip` feature: only zipped Windows installers and compressed AppImages need it, and a
# release publishes neither (the NSIS .exe and the AppImage as they are). It also kept zip 4, whose
# extraction advisories (RUSTSEC-2026-0367 to 0369) are fixed in zip 9 only.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-autostart = "=2.7.0"
time = { version = "=0.3.55", features = ["local-offset", "formatting"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time"] }
