[package]
name = "ruchoir-desktop-core"
description = "The desktop app's logic that needs no window: instances, tokens, sign-in, proxy rules, realtime."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
futures-util = "=0.3.34"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "gzip"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "=2.5.8"

[dev-dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "=3.27.0"
